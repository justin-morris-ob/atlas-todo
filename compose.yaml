name: atlas-hello-todo-poc
services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TODO_POSTGRES_PASSWORD:?Run local setup first}
      POSTGRES_DB: hello_todo
    ports:
      - "127.0.0.1:55470:5432"
    volumes:
      - todo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hello_todo"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  todo-data:
